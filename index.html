<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Гирлянда для OBS</title>
<meta name="garland-version" content="2026-11-14.8">
<style>
:root{--bg:#121018;--panel:#1b1822;--panel2:#24202d;--line:#332d3e;--text:#efeaf5;--muted:#9c94ab;--accent:#ffb347;--accent-ink:#2a1a05;--danger:#ff6b7d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
#app{display:none}
html.overlay #cv{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
html.edit body{background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html.edit #app{display:flex;height:100%}
#panel{width:340px;flex:none;height:100%;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:18px 16px 40px}
#panel h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}
#panel .sub{color:var(--muted);margin:0 0 14px}
.sec{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 12px 6px;margin:0 0 12px}
.sec h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:600}
.row{margin:0 0 12px}
.row label{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.row label span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
select{width:100%;background:#15121b;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
button{font:inherit;color:var(--text);background:#15121b;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
button:hover{border-color:#4a4258}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;width:100%;padding:10px}
button.wide{width:100%}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 12px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;align-items:center}
.sw{position:relative;width:30px;height:30px}
.sw input{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
.sw b{position:absolute;right:-5px;top:-5px;width:16px;height:16px;border-radius:50%;background:#000;color:#fff;font-size:11px;line-height:16px;text-align:center;cursor:pointer;display:none}
.sw:hover b{display:block}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.th{position:relative;width:44px;height:44px;border-radius:8px;background:#0e0c12;border:1px solid var(--line);display:grid;place-items:center}
.th img{max-width:36px;max-height:36px}
.th b{position:absolute;right:-5px;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--danger);color:#000;font-size:11px;line-height:16px;text-align:center;cursor:pointer}
.note{color:var(--muted);font-size:12px;margin:0 0 12px}
.note b{color:var(--text);font-weight:600}
textarea{width:100%;height:70px;background:#0e0c12;color:var(--text);border:1px solid var(--line);border-radius:8px;font:11px monospace;margin:0 0 12px}
#stage{flex:1;display:flex;flex-direction:column;min-width:0;padding:14px 18px 18px;gap:10px}
#tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#hint{color:var(--muted);margin-left:8px}
#wrap{flex:1;display:grid;place-items:center;min-height:0}
#frame{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.5);background-size:cover;background-position:center}
#frame.bg-scene{background:radial-gradient(ellipse at 80% 70%,rgba(255,240,210,.18),transparent 25%),radial-gradient(ellipse at 20% 100%,#2b2850,transparent 60%),linear-gradient(#0c1024,#1b1e3d 70%,#262547)}
#frame.bg-checker{background:repeating-conic-gradient(#2a2a2e 0 25%,#1f1f23 0 50%) 0 0/24px 24px}
#frame.bg-light{background:linear-gradient(#dfe6ef,#c4cfdc)}
#frame #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tabs{position:sticky;top:-18px;z-index:5;display:flex;gap:4px;background:var(--panel);padding:8px 0 10px;margin:0 0 6px;border-bottom:1px solid var(--line)}
.tabs{display:grid!important;grid-template-columns:repeat(3,1fr)}
.tabs button{min-width:0;padding:7px 4px;font-size:12px;border-radius:8px;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;font-size:11.5px;line-height:1.2;text-align:center}
.card .ic{display:block;width:100%}
.card .ic svg{width:100%;height:auto;display:block}
.card .ic.emo{font-size:22px;line-height:34px}
.card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:#2a2116;color:var(--text);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}
details.more{margin:0 0 12px}
details.more summary{cursor:pointer;color:var(--muted);font-size:12px;margin:0 0 10px;list-style:none}
details.more summary::before{content:'▸ ';}
details.more[open] summary::before{content:'▾ ';}
.imgcards{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.imgcard{display:flex;gap:8px;background:#15121b;border:1px solid var(--line);border-radius:10px;padding:6px}
.imgcard.on{border-color:var(--accent)}
.imgcard .thumb{width:64px;height:64px;flex:none;border-radius:8px;background:repeating-conic-gradient(#2a2a2e 0 25%,#1f1f23 0 50%) 0 0/12px 12px;display:grid;place-items:center}
.imgcard .thumb img{max-width:60px;max-height:60px}
.imgctl{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.imgctl select{padding:4px 6px;font-size:12px}
.mini-row{display:flex;align-items:center;gap:6px}
.mini-row input[type=range]{flex:1}
.mini{font-size:11px;color:var(--muted);white-space:nowrap}
button.small{padding:3px 7px;font-size:11px}
button.danger{color:var(--danger)}
#tools .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
</style>
</head>
<body>
<div id="app"><aside id="panel"></aside><main id="stage"><div id="tools"></div><div id="wrap"><div id="frame" class="bg-scene"></div></div></main></div>
<canvas id="cv"></canvas>
<div id="toast"></div>

const CONF=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff7ad9','#ffffff'];
const BFLY=['#ff9ad5','#9ad0ff','#ffd36b','#b69aff','#8ef0c0'];
function fxCount(k,n){switch(k){case 'confetti':return Math.round(n*0.6);case 'sparkles':return Math.round(n*0.8);case 'blizzard':return Math.round(n*1.3);case 'rain':return Math.round(n*1.2);case 'fluff':return Math.round(n*0.25);
  case 'butterflies':return Math.min(16,Math.ceil(n/14));case 'fireflies':return Math.min(70,Math.ceil(n/3));case 'hearts':case 'stars':return Math.round(n*0.35);case 'bubbles':return Math.min(45,Math.ceil(n/5));case 'bats':return Math.min(12,Math.ceil(n/18));case 'fog':return n?7:0}return 0}
function fxDepth(){return cfg.fallDepth<1?VH*cfg.fallDepth+20:VH+40}
function fxLayers(){return layersOf().filter(l=>FX_KINDS.includes(l[0]))}
function newFx(k,init){
  const z=cfg.flake,R=Math.random,f={kind:k,ph:R()*6.283,r:(0.7+R()*0.6)*z,rot:R()*6.283,vr:(R()-0.5)*0.08,fl:R()*6.283,vf:0.05+R()*0.1,c:pick(CONF),life:1};
  const top=()=>{f.x=R()*(VW+400)-200;f.y=init?R()*fxDepth():-20-R()*80};
  switch(k){
    case 'confetti':top();f.vy=0.9+R()*0.9;f.curl=R()<0.2;f.r*=2;break;
    case 'sparkles':top();f.vy=0.3+R()*0.5;f.c=R()<0.5?'#fff3b0':'#ffffff';break;
    case 'blizzard':top();f.vy=1.6+R()*1.6;f.r=(0.6+R()*1.4)*z;break;
    case 'rain':top();f.vy=10+R()*5;f.vx=0;f.r=z;break;
    case 'hearts':top();f.vy=0.6+R()*0.6;f.c=pick(['#ff2d55','#ff7aa2','#ffc2d4','#ff4d6d']);break;
    case 'stars':top();f.vy=0.5+R()*0.6;f.c=pick(['#ffd25a','#fff3b0','#ffffff']);break;
    case 'fluff':f.x=R()*VW;f.y=init?R()*VH*0.9:-20;f.vy=0.15+R()*0.25;break;
    case 'fireflies':f.x=R()*VW;f.y=VH*(0.15+R()*0.8);f.a=R()*6.283;f.sp=0.4+R()*0.6;break;
    case 'butterflies':f.x=R()*VW;f.y=VH*(0.1+R()*0.8);f.a=R()*6.283;f.sp=1+R()*0.8;f.c=pick(BFLY);break;
    case 'bats':{const L=R()<0.5;f.dir=L?1:-1;f.x=init?R()*VW:(L?-60:VW+60);f.y=VH*(0.08+R()*0.5);f.sp=2.5+R()*2;f.wait=init?0:R()*120;break}
    case 'bubbles':f.x=R()*VW;f.y=init?VH*(0.3+R()*0.7):VH+30;f.vy=-(0.5+R()*0.8);f.top=VH*(0.05+R()*0.6);f.r=(10+R()*16)*z;f.pop=0;break;
    case 'fog':f.x=R()*(VW+600)-300;f.y=VH*(0.82+R()*0.2);f.r=260+R()*220;f.vx=(R()-0.5)*0.3;break;
    case 'shooting':{f.x=R()*VW*0.9+VW*0.05;f.y=R()*VH*0.35;const a=(R()<0.5?0.35:Math.PI-0.35)+(R()-0.5)*0.3;f.vx=Math.cos(a)*16;f.vy=Math.sin(a)*16;break}
  }
  return f;
}
function syncFx(){
  let out=fx.filter(f=>f.kind==='splash');
  for(const [k,n] of fxLayers()){const mine=fx.filter(f=>f.kind===k);const N=fxCount(k,n);while(mine.length<N)mine.push(newFx(k,true));if(k!=='shooting')mine.length=Math.min(mine.length,N);out=out.concat(mine)}
  fx=out;
}
function updateFx(t){
  const out=[],sp=cfg.fallSpeed,ssp=Math.sqrt(sp),lim=fxDepth(),lay=fxLayers();
  for(const f of fx){let gone=false;const w=windAt(t,f.x);
    switch(f.kind){
      case 'confetti':f.y+=f.vy*sp*(0.8+0.3*Math.sin(t*2+f.ph));f.x+=(w*40+Math.sin(t*1.3+f.ph)*0.8)*ssp;f.rot+=f.vr;f.fl+=f.vf;gone=f.y>lim;break;
      case 'sparkles':f.y+=f.vy*sp;f.x+=(w*25+Math.sin(t+f.ph)*0.3)*ssp;gone=f.y>lim;break;
      case 'blizzard':{const d=windDir(t)||1;f.y+=f.vy*sp;f.x+=(w*70+Math.sign(d)*(1.6+1.2*Math.max(0,Math.sin(t*0.6+f.ph*0.1))))*ssp*(0.6+f.r*0.3);gone=f.y>lim||f.x<-260||f.x>VW+260;break}
      case 'rain':f.vx=w*90;f.y+=f.vy*sp;f.x+=f.vx*ssp*0.6;if(f.y>lim){gone=true;if(cfg.fallDepth>=1&&Math.random()<0.4)out.push({kind:'splash',x:f.x,y:VH-4-Math.random()*10,life:1,r:f.r})}break;
      case 'hearts':case 'stars':f.y+=f.vy*sp*(0.8+0.3*Math.sin(t*1.1+f.ph));f.x+=(w*35+Math.sin(t*0.9+f.ph)*0.7)*ssp;f.rot+=f.vr*0.5;f.fl+=f.vf*0.5;gone=f.y>lim;break;
      case 'fluff':f.y+=(f.vy+Math.sin(t*0.7+f.ph)*0.25)*sp;f.x+=(w*45+Math.sin(t*0.45+f.ph)*0.6)*ssp;f.rot=Math.sin(t*0.8+f.ph)*0.4;gone=f.y>lim||f.x<-100||f.x>VW+100;break;
      case 'fireflies':f.a+=Math.sin(t*0.7+f.ph*3)*0.04+(Math.random()-0.5)*0.08;f.x+=Math.cos(f.a)*f.sp+w*8;f.y+=Math.sin(f.a)*f.sp*0.7;
        if(f.x<10||f.x>VW-10)f.a=Math.PI-f.a;if(f.y<VH*0.08||f.y>VH-10)f.a=-f.a;f.x=Math.max(5,Math.min(VW-5,f.x));f.y=Math.max(VH*0.05,Math.min(VH-5,f.y));break;
      case 'butterflies':f.a+=Math.sin(t*0.9+f.ph*2)*0.03+(Math.random()-0.5)*0.06;f.x+=Math.cos(f.a)*f.sp+w*15;f.y+=Math.sin(f.a)*f.sp*0.6+Math.sin(t*6+f.ph)*0.6;
        if(f.x<20||f.x>VW-20)f.a=Math.PI-f.a;if(f.y<VH*0.08||f.y>VH*0.95)f.a=-f.a;f.x=Math.max(10,Math.min(VW-10,f.x));f.y=Math.max(VH*0.05,Math.min(VH*0.97,f.y));f.fl+=0.35;break;
      case 'bats':if(f.wait>0){f.wait--;break}f.x+=f.dir*f.sp;f.y+=Math.sin(t*2+f.ph)*0.8;f.fl+=0.45;gone=f.dir>0?f.x>VW+80:f.x<-80;break;
      case 'bubbles':if(f.pop){f.pop+=0.08;gone=f.pop>=1;break}f.y+=f.vy;f.x+=Math.sin(t*1.2+f.ph)*0.5+w*20;if(f.y<f.top)f.pop=0.01;break;
      case 'fog':f.x+=f.vx+w*12;if(f.x>VW+400)f.x=-400;if(f.x<-400)f.x=VW+400;break;
      case 'shooting':f.x+=f.vx;f.y+=f.vy;f.life-=0.018;gone=f.life<=0;break;
      case 'splash':f.life-=0.08;gone=f.life<=0;break;
    }
    if(gone){if(f.kind!=='splash'&&f.kind!=='shooting'&&lay.some(l=>l[0]===f.kind))out.push(newFx(f.kind,false))}else out.push(f);
  }
  for(const [k,n] of lay)if(k==='shooting'&&Math.random()<0.0015+n/500*0.01)out.push(newFx('shooting',true));
  fx=out;
}
function fadeXY(x,y){
  let a=1;
  if(cfg.fallDepth<1){const L=VH*cfg.fallDepth,st=L*0.55;if(y>st)a*=Math.max(0,1-(y-st)/(L-st))}
  if(cfg.fallClear>0){const u=Math.abs(x/VW-0.5)*2,c=cfg.fallClear;if(u<c){const e=c*0.55;a*=u<e?0:(u-e)/(c-e)}}
  return a;
}
function heartPath(w){ctx.beginPath();ctx.moveTo(0,-w*0.25);ctx.bezierCurveTo(0,-w*0.8,-w,-w*0.8,-w,-w*0.1);ctx.bezierCurveTo(-w,w*0.45,-w*0.25,w*0.65,0,w);ctx.bezierCurveTo(w*0.25,w*0.65,w,w*0.45,w,-w*0.1);ctx.bezierCurveTo(w,-w*0.8,0,-w*0.8,0,-w*0.25);ctx.closePath()}
function starPath(R,ri){ctx.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?ri:R;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath()}
function drawFx(t){
  const tr=1-(cfg.fallTransp||0);
  for(const f of fx){if(f.kind!=='fog')continue;
    const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);const b=0.10+0.04*Math.sin(t*0.3+f.ph);g.addColorStop(0,`rgba(220,226,240,${b})`);g.addColorStop(1,'rgba(220,226,240,0)');
    ctx.globalAlpha=tr;ctx.fillStyle=g;ctx.fillRect(f.x-f.r,f.y-f.r,f.r*2,f.r*2)}
  for(const f of fx){
    if(f.kind==='fog')continue;
    let a=tr;if(FALLING.includes(f.kind))a*=fadeXY(f.x,f.y);if(a<=0.01)continue;
    ctx.globalAlpha=a;
    switch(f.kind){
      case 'confetti':ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);
        if(f.curl){ctx.strokeStyle=f.c;ctx.lineWidth=1.6*f.r;ctx.lineCap='round';ctx.beginPath();for(let i=0;i<=10;i++)ctx.lineTo(Math.sin(i*0.9+f.fl)*f.r*2.2,(i-5)*f.r*1.6);ctx.stroke()}
        else{ctx.scale(1,Math.cos(f.fl)||0.05);ctx.fillStyle=f.c;ctx.fillRect(-f.r*3,-f.r*1.6,f.r*6,f.r*3.2)}
        ctx.restore();break;
      case 'sparkles':{const tw=Math.pow(0.5+0.5*Math.sin(t*5+f.ph*7),2);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a*(0.3+0.7*tw);const s=f.r*(3+2*tw);
        ctx.fillStyle=f.c;ctx.beginPath();ctx.moveTo(f.x,f.y-s);ctx.quadraticCurveTo(f.x,f.y,f.x+s,f.y);ctx.quadraticCurveTo(f.x,f.y,f.x,f.y+s);ctx.quadraticCurveTo(f.x,f.y,f.x-s,f.y);ctx.quadraticCurveTo(f.x,f.y,f.x,f.y-s);ctx.fill();
        ctx.globalCompositeOperation='source-over';break}
      case 'blizzard':{ctx.globalAlpha=a*(0.5+0.4*Math.min(1,f.r/2));const R=f.r*1.7;ctx.drawImage(flakeSprite,f.x-R,f.y-R,R*2,R*2);break}
      case 'rain':ctx.globalAlpha=a*0.55;ctx.strokeStyle='#bcd6ff';ctx.lineWidth=Math.max(1,f.r*1.2);ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x-f.vx*1.2,f.y-f.vy*1.6);ctx.stroke();break;
      case 'splash':ctx.globalAlpha=0.5*f.life*tr;ctx.strokeStyle='#bcd6ff';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(f.x,f.y,(1-f.life)*10*f.r+2,(1-f.life)*3*f.r+1,0,Math.PI,2*Math.PI);ctx.stroke();break;
      case 'hearts':ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.sin(f.rot)*0.4);ctx.scale(0.4+0.6*Math.abs(Math.cos(f.fl)),1);ctx.globalAlpha=a*0.9;ctx.fillStyle=f.c;heartPath(f.r*8);ctx.fill();ctx.restore();break;
      case 'stars':ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.globalAlpha=a*0.9;ctx.fillStyle=f.c;starPath(f.r*7,f.r*3);ctx.fill();ctx.restore();
        ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a*0.35;const R=f.r*10;ctx.drawImage(glowSprite('#ffd25a'),f.x-R,f.y-R,R*2,R*2);ctx.globalCompositeOperation='source-over';break;
      case 'fluff':{ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.globalAlpha=a*0.85;const L=f.r*10;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,f.r*10);
        for(let k=0;k<12;k++){const an=-Math.PI*(0.08+0.84*k/11);ctx.moveTo(0,0);ctx.lineTo(Math.cos(an)*L,Math.sin(an)*L)}ctx.stroke();
        ctx.fillStyle='rgba(200,180,140,.9)';ctx.beginPath();ctx.ellipse(0,f.r*10,f.r*0.8,f.r*1.8,0,0,6.283);ctx.fill();ctx.restore();break}
      case 'fireflies':{let bl=Math.max(0,Math.sin(t*1.8+f.ph*5));bl*=bl;if(bl<0.02)break;ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a*bl;const R=f.r*14;ctx.drawImage(glowSprite('#d8ff6a'),f.x-R,f.y-R,R*2,R*2);
        ctx.fillStyle='#f6ffb0';ctx.beginPath();ctx.arc(f.x,f.y,f.r*1.6,0,6.283);ctx.fill();ctx.globalCompositeOperation='source-over';break}
      case 'butterflies':{const s=f.r*16,open=0.15+0.85*Math.abs(Math.sin(f.fl));ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);
        for(const sd of [-1,1]){ctx.fillStyle=f.c;ctx.beginPath();ctx.ellipse(-s*0.05,sd*s*0.5*open,s*0.42,s*0.5*open,0,0,6.283);ctx.fill();
          ctx.fillStyle=rgb(mix(hex2rgb(f.c),WHITE,0.35));ctx.beginPath();ctx.ellipse(-s*0.38,sd*s*0.35*open,s*0.26,s*0.32*open,0,0,6.283);ctx.fill()}
        ctx.fillStyle='#2a2028';ctx.beginPath();ctx.ellipse(0,0,s*0.45,s*0.08,0,0,6.283);ctx.fill();ctx.restore();break}
      case 'bats':{if(f.wait>0)break;const s=f.r*24,fl=Math.sin(f.fl);ctx.save();ctx.translate(f.x,f.y);ctx.fillStyle='#15101a';
        for(const sd of [-1,1]){ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(sd*s*0.4,-s*0.3*fl-s*0.1,sd*s,-s*0.2*fl);ctx.lineTo(sd*s*0.75,s*0.05);ctx.quadraticCurveTo(sd*s*0.5,-s*0.02,sd*s*0.4,s*0.1);ctx.quadraticCurveTo(sd*s*0.25,0,0,s*0.08);ctx.closePath();ctx.fill()}
        ctx.beginPath();ctx.ellipse(0,s*0.03,s*0.1,s*0.14,0,0,6.283);ctx.fill();ctx.fillStyle='#ff4040';ctx.beginPath();ctx.arc(-s*0.035,0,s*0.02,0,6.283);ctx.arc(s*0.035,0,s*0.02,0,6.283);ctx.fill();ctx.restore();break}
      case 'bubbles':if(f.pop){ctx.globalAlpha=a*(1-f.pop);ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;ctx.setLineDash([3,5]);ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1+f.pop*0.6),0,6.283);ctx.stroke();ctx.setLineDash([]);break}
        {const g=ctx.createRadialGradient(f.x,f.y,f.r*0.5,f.x,f.y,f.r);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.8,'rgba(190,225,255,.18)');g.addColorStop(1,'rgba(230,245,255,.5)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();
        const h=ctx.createLinearGradient(f.x-f.r,f.y-f.r,f.x+f.r,f.y+f.r);h.addColorStop(0,'rgba(255,140,220,.22)');h.addColorStop(0.5,'rgba(140,255,230,.12)');h.addColorStop(1,'rgba(140,170,255,.22)');ctx.fillStyle=h;ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(f.x-f.r*0.4,f.y-f.r*0.45,f.r*0.22,f.r*0.12,-0.6,0,6.283);ctx.fill();break}
      case 'shooting':{ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a*Math.min(1,f.life*2);const g=ctx.createLinearGradient(f.x,f.y,f.x-f.vx*7,f.y-f.vy*7);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');
        ctx.strokeStyle=g;ctx.lineWidth=2*cfg.flake;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x-f.vx*7,f.y-f.vy*7);ctx.stroke();const R=10*cfg.flake;ctx.drawImage(glowSprite('#cfe4ff'),f.x-R,f.y-R,R*2,R*2);ctx.globalCompositeOperation='source-over';break}
    }
  }
  ctx.globalAlpha=1;
}

/* ---------- render ---------- */
function bright(b,t){
  const sp=cfg.speed;
  switch(cfg.mode){
    case 'steady':return 1;
    case 'twinkle':{const v=0.5+0.5*Math.sin(t*sp*b.fr*2.2+b.ph);return 0.3+0.7*v*v}
    case 'chase':{const x=((b.gi+t*sp*4)%3+3)%3;return 0.12+0.88*(x<1?Math.sin(Math.PI*x):0)}
    case 'wave':return 0.15+0.85*(0.5+0.5*Math.sin(b.gi*0.5-t*sp*3));
    case 'flash':{const slot=Math.floor(t*sp*1.5+b.ph);return hash(b.gi*7.13+slot)>0.42?1:0.12}
    case 'cycle':return 0.85+0.15*Math.sin(t*2+b.ph);
  }
  return 1;
}
function colorOf(b,t){
  const P=cfg.palette.length?cfg.palette:['#ffd49a'];const n=P.length;
  if(cfg.mode==='cycle'&&n>1){const pos=b.gi+t*cfg.speed*0.6;const a=Math.floor(pos)%n;let f=pos-Math.floor(pos);f=f*f*(3-2*f);return [P[a],P[(a+1)%n],f]}
  return [P[b.gi%n],null,0];
}
function bulbPath(s){
  const rx=s*0.36,cy=s*1.0,ry=s*0.58;
  ctx.beginPath();ctx.moveTo(-rx*0.55,s*0.42);
  ctx.bezierCurveTo(-rx*1.3,s*0.72,-rx*0.95,cy+ry*0.7,0,cy+ry);
  ctx.bezierCurveTo(rx*0.95,cy+ry*0.7,rx*1.3,s*0.72,rx*0.55,s*0.42);ctx.closePath();
}
const BULB_SHAPES=[['classic','Груша (классика)'],['round','Шарик'],['flame','Свеча-пламя'],['c9','Ретро-конус'],['drop','Капля'],['mini','Рисинка (мелкие)'],['lantern','Бочонок'],['starlamp','Звёздочка']];
function bulbShapePath(s){
  const k=cfg.bulbShape||'classic';ctx.beginPath();
  if(k==='round'){ctx.arc(0,s*0.98,s*0.5,0,6.283)}
  else if(k==='flame'){ctx.moveTo(-s*0.2,s*0.42);ctx.bezierCurveTo(-s*0.48,s*0.85,-s*0.22,s*1.3,0,s*1.78);ctx.bezierCurveTo(s*0.22,s*1.3,s*0.48,s*0.85,s*0.2,s*0.42);ctx.closePath()}
  else if(k==='c9'){ctx.moveTo(-s*0.3,s*0.42);ctx.quadraticCurveTo(-s*0.42,s*1.0,0,s*1.65);ctx.quadraticCurveTo(s*0.42,s*1.0,s*0.3,s*0.42);ctx.closePath()}
  else if(k==='drop'){ctx.moveTo(-s*0.12,s*0.42);ctx.bezierCurveTo(-s*0.58,s*0.95,-s*0.52,s*1.62,0,s*1.62);ctx.bezierCurveTo(s*0.52,s*1.62,s*0.58,s*0.95,s*0.12,s*0.42);ctx.closePath()}

const WIRE_STYLES=[['plain','Обычный провод'],['twist','Витой (две жилы)'],['liana','Лиана'],['rope','Верёвка'],['beads','Бусины'],['snake','Змейка (волной)'],['tinsel','Мишура'],['none','Невидимый (лампочки в воздухе)']];
function wireStrip(P){
  const D=[];for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1];for(let k=0;k<3;k++){const u=k/3;D.push([a.x+(b.x-a.x)*u,a.y+(b.y-a.y)*u])}}const l=P[P.length-1];D.push([l.x,l.y]);
  const R=[];let arc=0;for(let i=0;i<D.length;i++){if(i)arc+=Math.hypot(D[i][0]-D[i-1][0],D[i][1]-D[i-1][1]);const a=D[Math.max(0,i-1)],b=D[Math.min(D.length-1,i+1)];let tx=b[0]-a[0],ty=b[1]-a[1];const L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;R.push({x:D[i][0],y:D[i][1],nx:-ty,ny:tx,tx,ty,s:arc})}
  return R;
}
function strokeOff(R,f){ctx.beginPath();R.forEach((p,i)=>{const o=f(p.s);const x=p.x+p.nx*o,y=p.y+p.ny*o;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function drawWire(ch,wc,t){
  const st=cfg.wireStyle||'plain',W=cfg.wire,col=cfg.wireColor,hi=rgb(mix(wc,WHITE,0.35),0.35),dk=rgb(mix(wc,BLACK,0.35)),lt=rgb(mix(wc,WHITE,0.25));
  if(st==='none')return;
  if(st==='plain'){wirePath(ch.P);ctx.strokeStyle=col;ctx.lineWidth=W;ctx.stroke();ctx.strokeStyle=hi;ctx.lineWidth=Math.max(0.6,W*0.3);ctx.stroke();return}
  const R=wireStrip(ch.P);
  if(st==='twist'){const per=W*5+4,f=s=>Math.sin(s/per*6.283)*W*0.45;ctx.lineWidth=Math.max(0.8,W*0.75);ctx.strokeStyle=dk;strokeOff(R,f);ctx.strokeStyle=col;strokeOff(R,s=>-f(s));ctx.strokeStyle=hi;ctx.lineWidth=Math.max(0.5,W*0.25);strokeOff(R,s=>-f(s));return}
  if(st==='liana'){ctx.strokeStyle=col;ctx.lineWidth=W*1.6;strokeOff(R,()=>0);ctx.strokeStyle=dk;ctx.lineWidth=Math.max(0.7,W*0.6);strokeOff(R,s=>Math.sin(s/(W*14+10)*6.283)*W*0.9);ctx.strokeStyle=lt;ctx.lineWidth=Math.max(0.5,W*0.35);strokeOff(R,s=>Math.cos(s/(W*9+7)*6.283)*W*0.6);return}

let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(0.1,(now-last)/1000);last=now;
  let n=0;while(acc>=1/60&&n<4){step(1/60,false);acc-=1/60;n++}
  if(n===4)acc=0;

}

/* ---------- viewer clicks (Heat extension) ---------- */
let rings=[],heatWs=null,heatState='off',heatRetry=0;
function tugAt(x,y,power){
  for(const f of fx)if(f.kind==='bubbles'&&!f.pop&&Math.hypot(f.x-x,f.y-y)<f.r+40)f.pop=0.01;
  power=power==null?cfg.tugPower:power;
  if(cfg.clickRings)rings.push({x,y,life:1});
  let best=null,bd=170;
  for(const ch of chains)ch.P.forEach((p,i)=>{const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best={ch,i}}});
  if(!best)return false;
  const P=best.ch.P;const str=13*power*(1-bd/240);
  const vy=(Math.random()<0.5?-1:0.7)*str,vx=(Math.random()-0.5)*str*1.2;
  for(let k=-9;k<=9;k++){const q=P[best.i+k];if(!q||q.pin)continue;const f=1-Math.abs(k)/10;q.px=q.x-vx*f;q.py=q.y-vy*f}
  for(const b of bulbs)if(b.ch===best.ch&&Math.abs(b.i-best.i)<=9){b.px=b.x-vx*1.3;b.py=b.y-vy*1.3}
  return true;
}
const drags=new Map();
function dragAt(id,x,y){
  let d=drags.get(id);
  if(!d){
    let best=null,bd=130;
    for(const ch of chains)for(const p of ch.P){if(p.pin||p.grab)continue;const dd=Math.hypot(p.x-x,p.y-y);if(dd<bd){bd=dd;best=p}}
    if(!best)return;
    d={p:best,sx:best.x,sy:best.y};best.grab=true;drags.set(id,d);
  }
  let dx=x-d.sx,dy=y-d.sy;const L=Math.hypot(dx,dy),M=220*Math.max(0.5,cfg.tugPower);if(L>M){dx*=M/L;dy*=M/L}
  d.p.tx=d.sx+dx;d.p.ty=d.sy+dy;d.last=performance.now();
}
function releaseDrag(id){const d=drags.get(id);if(!d)return;d.p.grab=false;d.p.tx=d.p.ty=null;drags.delete(id)}
function stepRings(){
  for(const r of rings)r.life-=1/45;rings=rings.filter(r=>r.life>0);
  const now=performance.now();for(const [id,d] of drags)if(now-d.last>1500)releaseDrag(id);
}
function demoDrag(){
  const ch=chains[Math.random()*chains.length|0];if(!ch)return;const p=ch.P[(ch.P.length*(0.2+Math.random()*0.6))|0];
  const id='demo'+Math.random(),sx=p.x,sy=p.y,ang=Math.random()*Math.PI;let k=0;
  const iv=setInterval(()=>{k++;dragAt(id,sx+Math.cos(ang)*k*14,sy+Math.abs(Math.sin(ang))*k*14);if(k>=12){clearInterval(iv);setTimeout(()=>releaseDrag(id),300)}},80);
}
function copyText(t,ok,ta){
  const fallback=()=>{try{let a=ta;let tmp=false;if(!a){a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(a);tmp=true}a.focus();a.select();const r=document.execCommand('copy');if(tmp)a.remove();if(r)ok()}catch(e){}};
  if(window.isSecureContext&&navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fallback)}else fallback();
}
function heatConnect(){
  if(heatWs){try{heatWs.onclose=null;heatWs.close()}catch(e){}heatWs=null}
  const green=cfg.heatProvider==='green';
  if(green?!cfg.heatLogin:!cfg.heatId){heatState='off';heatStatus();return}
  heatState='connecting';heatStatus();
  let ws;try{ws=new WebSocket(green?'wss://heat.prod.kr/'+encodeURIComponent(cfg.heatLogin):'wss://heat-api.j38.net/channel/'+encodeURIComponent(cfg.heatId))}catch(e){heatState='error';heatStatus();return}
  heatWs=ws;
  ws.onopen=()=>{heatState='on';heatRetry=0;heatStatus()};
  ws.onmessage=e=>{try{const m=JSON.parse(e.data);dbgEv(m);const x=parseFloat(m.x)*VW,y=parseFloat(m.y)*VH,id=String(m.id||'anon');if(m.type==='release'){releaseDrag(id);return}if(!isFinite(x)||!isFinite(y))return;if(m.type==='click'){if(!drags.has(id))tugAt(x,y)}else if(m.type==='drag')dragAt(id,x,y)}catch(err){}};
  ws.onclose=()=>{heatState='error';heatStatus();heatWs=null;clearTimeout(heatConnect.t);heatConnect.t=setTimeout(heatConnect,Math.min(30000,2000*(++heatRetry)))};
}
const DBG=qs.get('debug')==='1';if(DBG&&!EDIT&&!IN_OBS)document.documentElement.style.background='linear-gradient(#0c1024,#1b1e3d 70%,#262547)';let dbgEl=null,dbgN=0,dbgLast='—';
function dbgEv(m){dbgN++;dbgLast=(m.type||'?')+' '+new Date().toLocaleTimeString();dbgShow()}
function dbgShow(){
  if(!DBG)return;
  if(!dbgEl){dbgEl=document.createElement('div');dbgEl.style.cssText='position:fixed;left:8px;bottom:8px;font:13px monospace;color:#fff;background:rgba(0,0,0,.6);padding:6px 9px;border-radius:6px;z-index:99;white-space:pre';document.body.appendChild(dbgEl)}
  const green=cfg.heatProvider==='green';
  dbgEl.textContent=`расширение: ${green?'GreenHeat':'Heat'}\nканал: ${green?(cfg.heatLogin||'не указан'):(cfg.heatLogin||'')+' (id '+(cfg.heatId||'нет')+')'}\nсвязь: ${{off:'не настроено',connecting:'подключаюсь',on:'подключено',error:'нет связи'}[heatState]}\nсобытий пришло: ${dbgN}, последнее: ${dbgLast}`;
}
function heatStatus(){dbgShow();const el=document.getElementById('heatst');if(!el)return;el.textContent={off:'Не подключено',connecting:'Подключаюсь…',on:'✓ Подключено — клики зрителей будут приходить',error:'Нет связи с Heat, пробую ещё раз…'}[heatState]}

/* ---------- start ---------- */
loadImages();
if(EDIT){initEditor();initDirty()}
resize();build();syncFlakes();syncEdge();heatConnect();
addEventListener('resize',()=>{const oldVH=VH;resize();if(VH!==oldVH){build();flakes=[];syncFlakes()}});
if(EDIT)new ResizeObserver(()=>resize()).observe(document.getElementById('wrap'));
requestAnimationFrame(frame);
</script>
